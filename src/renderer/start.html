<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <title>Mobile Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f2;
      --surface: #ffffff;
      --line: #e1e3de;
      --text: #121412;
      --text-2: #545b55;
      --accent: #0a7f50;
      --chip: #e8ece6;
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101214;
        --surface: #181b1e;
        --line: #2a2e33;
        --text: #eceee9;
        --text-2: #a2a9a3;
        --accent: #3ddc97;
        --chip: #23272b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
               max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    main { max-width: 560px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 14px; font-weight: 600; }
    .brand svg { color: var(--text); }
    h1 { margin: 28px 0 8px; font-size: 30px; line-height: 1.12; letter-spacing: -0.025em; font-weight: 700; text-wrap: balance; }
    .lead { margin: 0 0 28px; color: var(--text-2); text-wrap: pretty; }
    .metrics {
      margin: 0 0 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      overflow: hidden;
    }
    .metrics div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 16px; }
    .metrics div + div { border-top: 1px solid var(--line); }
    .metrics dt { color: var(--text-2); }
    .metrics dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .metrics .ua { flex-direction: column; gap: 4px; }
    .metrics .ua dd { font: 12px/1.45 ui-monospace, "Cascadia Mono", Menlo, monospace; font-weight: 400; color: var(--text-2); text-align: left; overflow-wrap: anywhere; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: -0.01em; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { position: relative; padding: 0 0 14px 22px; color: var(--text-2); }
    li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 0.55em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    li strong { color: var(--text); font-weight: 600; }
    code { padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--text); font: 14px ui-monospace, "Cascadia Mono", Menlo, monospace; }
    .touch { margin-top: 8px; padding: 14px 16px; border-radius: 14px; background: var(--chip); color: var(--text-2); font-size: 14px; touch-action: none; }
    .touch b { color: var(--text); font-variant-numeric: tabular-nums; }
    .credit { margin: 24px 0 0; color: var(--text-2); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
        <rect x="8" y="3" width="16" height="26" rx="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="16" cy="18" r="3.4" fill="var(--accent)"/>
      </svg>
      Mobile Preview
    </div>

    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>

    <dl class="metrics">
      <div><dt data-t="viewport"></dt><dd id="m-viewport"></dd></div>
      <div><dt data-t="screen"></dt><dd id="m-screen"></dd></div>
      <div><dt data-t="dpr"></dt><dd id="m-dpr"></dd></div>
      <div><dt data-t="orientation"></dt><dd id="m-orientation"></dd></div>
      <div><dt data-t="touch"></dt><dd id="m-touch"></dd></div>
      <div><dt data-t="scheme"></dt><dd id="m-scheme"></dd></div>
      <div class="ua"><dt>User-Agent</dt><dd id="m-ua"></dd></div>
    </dl>

    <h2 data-t="howTitle"></h2>
    <ul>
      <li data-t="tip1"></li>
      <li data-t="tip2"></li>
      <li data-t="tip3"></li>
    </ul>
    <div class="touch" id="touch-test" data-t="touchTest"></div>
    <p class="credit"><span data-t="author"></span>: Hayotbek Ismoilov · github.com/ismoillooff</p>
  </main>

  <script>
    (function () {
      var S = {
        uz: {
          title: 'Loyihangizni telefonda koʻring',
          lead: 'Yuqoridagi manzil qatoriga dev server portini yozing yoki loyiha papkasini oynaga tashlang.',
          viewport: 'Viewport', screen: 'Ekran', dpr: 'Piksel zichligi', orientation: 'Yoʻnalish',
          touch: 'Sensorli ekran', scheme: 'Rang sxemasi',
          portrait: 'Portret', landscape: 'Albom', yes: 'Ha', no: 'Yoʻq', points: 'nuqta',
          light: 'Yorugʻ', dark: 'Qorongʻi',
          howTitle: 'Qanday boshlash kerak',
          tip1: 'Loyihada <code>npm run dev</code> ni ishga tushiring, soʻng manzil qatoriga faqat portni yozing — masalan <code>5173</code>.',
          tip2: 'Oddiy HTML loyiha boʻlsa, papkani oynaga <strong>tashlang</strong>. Fayl saqlanganda sahifa oʻzi yangilanadi.',
          tip3: '<strong>QR</strong> tugmasi bilan xuddi shu sahifani haqiqiy telefoningizda oching.',
          touchTest: 'Bu yerni sichqoncha bilan bosib torting — sensor hodisalarini tekshirish uchun.',
          touches: 'Sensor hodisasi', author: 'Muallif'
        },
        ru: {
          title: 'Смотрите проект на телефоне',
          lead: 'Введите порт dev-сервера в адресную строку сверху или перетащите папку проекта в окно.',
          viewport: 'Viewport', screen: 'Экран', dpr: 'Плотность пикселей', orientation: 'Ориентация',
          touch: 'Сенсорный экран', scheme: 'Цветовая схема',
          portrait: 'Портретная', landscape: 'Альбомная', yes: 'Да', no: 'Нет', points: 'точек',
          light: 'Светлая', dark: 'Тёмная',
          howTitle: 'Как начать',
          tip1: 'Запустите <code>npm run dev</code> в проекте и введите в адресной строке только порт — например <code>5173</code>.',
          tip2: 'Для обычного HTML-проекта <strong>перетащите</strong> папку в окно. Страница обновится при сохранении файла.',
          tip3: 'Кнопка <strong>QR</strong> откроет эту же страницу на вашем настоящем телефоне.',
          touchTest: 'Нажмите и потяните здесь мышью — так можно проверить сенсорные события.',
          touches: 'Сенсорное событие', author: 'Автор'
        },
        en: {
          title: 'See your project on a phone',
          lead: 'Type your dev server port in the address bar above, or drop a project folder onto the window.',
          viewport: 'Viewport', screen: 'Screen', dpr: 'Pixel density', orientation: 'Orientation',
          touch: 'Touch screen', scheme: 'Color scheme',
          portrait: 'Portrait', landscape: 'Landscape', yes: 'Yes', no: 'No', points: 'points',
          light: 'Light', dark: 'Dark',
          howTitle: 'How to start',
          tip1: 'Run <code>npm run dev</code> in your project, then type just the port in the address bar — e.g. <code>5173</code>.',
          tip2: 'For a plain HTML project, <strong>drop</strong> the folder onto the window. The page reloads when you save a file.',
          tip3: 'Use the <strong>QR</strong> button to open the same page on your real phone.',
          touchTest: 'Press and drag here with the mouse to check touch events.',
          touches: 'Touch event', author: 'Author'
        }
      };
      var lang = new URLSearchParams(location.search).get('lang');
      var s = S[lang] || S.uz;
      document.documentElement.lang = S[lang] ? lang : 'uz';
      document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = s[el.getAttribute('data-t')] || ''; });

      var dark = matchMedia('(prefers-color-scheme: dark)');
      function update() {
        var portrait = innerHeight >= innerWidth;
        document.getElementById('m-viewport').textContent = innerWidth + ' × ' + innerHeight;
        document.getElementById('m-screen').textContent = screen.width + ' × ' + screen.height;
        document.getElementById('m-dpr').textContent = Math.round(devicePixelRatio * 1000) / 1000 + 'x';
        document.getElementById('m-orientation').textContent = portrait ? s.portrait : s.landscape;
        var tp = navigator.maxTouchPoints || 0;
        document.getElementById('m-touch').textContent = tp > 0 ? s.yes + ' · ' + tp + ' ' + s.points : s.no;
        document.getElementById('m-scheme').textContent = dark.matches ? s.dark : s.light;
        document.getElementById('m-ua').textContent = navigator.userAgent;
      }
      update();
      addEventListener('resize', update);
      dark.addEventListener('change', update);

      var box = document.getElementById('touch-test');
      ['touchstart', 'touchmove', 'touchend'].forEach(function (type) {
        box.addEventListener(type, function (e) {
          var p = e.changedTouches && e.changedTouches[0];
          box.innerHTML = s.touches + ': <b>' + type + '</b>' + (p ? ' · ' + Math.round(p.clientX) + ', ' + Math.round(p.clientY) : '');
        }, { passive: true });
      });
    })();
  </script>
</body>
</html>
